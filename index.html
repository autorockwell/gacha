<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1a1a1a;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111214; --fg: #f2f2f2; --accent: #60a5fa; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 16px;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      margin: 0 0 0.25em;
      color: var(--accent);
    }
    p {
      font-size: 1.1rem;
      opacity: 0.8;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <p>This site deploys from GitHub through Cloudflare Pages.</p>
</body>
</html>
