
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Which Creepy-Crawly Are You?</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  
  <div class="lava-container">
  <div class="lava-blob blob1"></div>
  <div class="lava-blob blob2"></div>
  <div class="lava-blob blob3"></div>
  <div class="lava-blob blob4"></div>
  </div>

  <main class="container">

    <header>
      <p class="brand">mixed feelings - THE CREEPY-CRAWLY QUIZ</p>
    </header>

    <section id="welcome" class="screen active">
      <h1>Crawl, don't run...</h1>
      <p class="description">
        To discover who you truly are.
      </p>

      <input
        id="username"
        type="text"
        placeholder="What shall we call you?"
        maxlength="30"
      >

      <p id="nameError" class="name-error"></p>

      <button id="startBtn">Start</button>

       <footer>
          Created by @animatikat.
       </footer>


    </section>


<!-- lore 1 -->
<section id="lore1" class="screen lore-screen">

  <div class="lore-content">
    <p id="loreText1"></p>
  </div>

  <button id="loreNext1" disabled>Next →</button>

</section>


<!-- lore 2 -->
<section id="lore2" class="screen lore-screen">

  <div class="lore-content">
    <p id="loreText2"></p>
  </div>

  <button id="loreNext2" disabled>Next →</button>

</section>

<section id="story" class="screen cinematic-screen">

  <!-- TOP BLACK BAR: QUESTION TEXT -->
  <div class="cinema-top">

    <div class="question-text-box">
      <p id="questionNumber" class="muted"></p>
      <h2 id="storyTitle"></h2>
      <p id="storyText" class="story-text"></p>
    </div>

  </div>


  <!-- MIDDLE: ANIMATION -->
  <div class="cinema-frame">
     <video
       id="questionVideo"
       autoplay
       muted
       loop
       playsinline
       preload="metadata"
    ></video>
  </div>


  <!-- BOTTOM BLACK BAR: ANSWERS + NAVIGATION -->
  <div class="cinema-bottom">

    <div id="answers" class="answers"></div>

    <div class="question-navigation">
      <button id="backBtn" class="secondary">← Back</button>
      <button id="nextBtn" disabled>Next →</button>
    </div>

  </div>

</section>


    <!-- cut -->
<section id="lore3" class="screen lore-screen">

  <div class="lore-content">
    <p id="loreText3"></p>
  </div>

  <button id="loreNext3" disabled>Next →</button>

</section>

    <section id="result" class="screen result-screen">
      <h1 id="resultTitle"></h1>

      <div class="result-gif-container">
         <img id="resultGif" src="" alt="Your reincarnation">
      </div>

      <button id="downloadBtn">Collect your talisman.</button>
      <button id="restartBtn">Once more!</button>
    </section>

  </main>

  <div id="fadeOverlay"></div>

</body>
</html>
